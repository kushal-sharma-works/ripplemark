apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: ripplemark-alerts
  namespace: ripplemark
  labels:
    release: kube-prometheus-stack
spec:
  groups:
    - name: ripplemark.availability
      rules:
        - alert: RipplemarkServiceDown
          expr: up{namespace="ripplemark"} == 0
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "Service unavailable"
            description: "{{ $labels.job }} is down for more than 5 minutes."
    - name: ripplemark.latency
      rules:
        - alert: RipplemarkHighP95Latency
          expr: histogram_quantile(0.95, sum by (le, job) (rate(http_request_duration_seconds_bucket{namespace="ripplemark"}[5m]))) > 1
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "High p95 latency"
            description: "{{ $labels.job }} p95 latency is above 1s for 10 minutes."
    - name: ripplemark.error-rate
      rules:
        - alert: RipplemarkHighErrorRate
          expr: (sum by (job) (rate(http_requests_total{namespace="ripplemark",status=~"5.."}[5m])) / sum by (job) (rate(http_requests_total{namespace="ripplemark"}[5m]))) > 0.05
          for: 10m
          labels:
            severity: critical
          annotations:
            summary: "High 5xx error rate"
            description: "{{ $labels.job }} has error rate > 5% for 10 minutes."
    - name: ripplemark.restarts
      rules:
        - alert: RipplemarkHighPodRestarts
          expr: sum by (pod) (increase(kube_pod_container_status_restarts_total{namespace="ripplemark"}[10m])) >= 3
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "High pod restart count"
            description: "{{ $labels.pod }} restarted at least 3 times in the last 10 minutes."
