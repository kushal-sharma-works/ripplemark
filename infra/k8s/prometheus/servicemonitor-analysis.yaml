apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: analysis-service
  namespace: ripplemark
  labels:
    release: kube-prometheus-stack
spec:
  namespaceSelector:
    matchNames: [ripplemark]
  selector:
    matchLabels:
      app.kubernetes.io/name: analysis-service
  endpoints:
    - port: http
      path: /metrics
      interval: 30s
