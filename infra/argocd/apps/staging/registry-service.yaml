apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: registry-service-staging
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: ripplemark
    env: staging
spec:
  project: default
  source:
    repoURL: https://github.com/kushal-sharma-works/ripplemark.git
    targetRevision: main
    path: infra/helm/registry-service
    helm:
      valueFiles:
        - values.yaml
        - values-staging.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: ripplemark
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
