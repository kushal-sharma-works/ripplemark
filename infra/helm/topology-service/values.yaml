replicaCount: 2

image:
  repository: ghcr.io/kushal-sharma-works/ripplemark-topology-service
  tag: latest
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 3001

ingress:
  enabled: true
  className: nginx
  host: topology.dev.ripplemark.local
  path: /

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 6
  targetCPUUtilizationPercentage: 75

config:
  PORT: "3001"
  NODE_ENV: development

secret:
  sealedSecretName: topology-service-secrets

probes:
  livenessPath: /health/liveness
  readinessPath: /health/readiness

securityContext:
  runAsNonRoot: true
  runAsUser: 10001
  readOnlyRootFilesystem: true
