openapi: 3.1.0
info:
  title: Ripplemark Topology API
  version: 1.0.0
  description: Topology graph ingestion and query APIs.
servers:
  - url: https://api.ripplemark.local/topology
security:
  - bearerAuth: []
paths:
  /api/v1/graph/nodes:
    get:
      summary: List service nodes
      responses:
        '200':
          description: Node list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ServiceNode'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }
    post:
      summary: Create node
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ServiceNode'
      responses:
        '201':
          description: Created node
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceNode'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }
  /api/v1/graph/edges:
    get:
      summary: List dependency edges
      responses:
        '200':
          description: Edge list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DependencyEdge'
              '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
              '403': { $ref: '#/components/responses/Forbidden' }
              '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
    post:
      summary: Create dependency edge
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DependencyEdge'
      responses:
        '201':
          description: Created edge
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DependencyEdge'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
  /api/v1/query/path:
    get:
      summary: Get shortest path between two services
      parameters:
        - in: query
          name: from
          required: true
          schema: { type: string }
        - in: query
          name: to
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Path nodes
          content:
            application/json:
              schema:
                type: object
                properties:
                  path:
                    type: array
                    items: { type: string }
                required: [path]
                examples:
                  default:
                    value:
                      path: [web-app, auth-gateway, registry-service]
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
  /health:
    get:
      security: []
      summary: Health check
      responses:
        '200':
          description: Service health
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, enum: [ok] }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  responses:
    BadRequest:
      description: Request validation failed
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          examples: { default: { value: { statusCode: 400, message: Invalid payload } } }
    Unauthorized:
      description: Missing or invalid token
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          examples: { default: { value: { statusCode: 401, message: Unauthorized } } }
    Forbidden:
      description: User lacks permission
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          examples: { default: { value: { statusCode: 403, message: Forbidden } } }
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          examples: { default: { value: { statusCode: 404, message: Not Found } } }
    InternalError:
      description: Unexpected server error
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          examples: { default: { value: { statusCode: 500, message: Internal Server Error } } }
  schemas:
    ErrorResponse:
      type: object
      properties:
        statusCode: { type: integer, example: 400 }
        message: { type: string, example: Invalid payload }
      required: [statusCode, message]
    ServiceNode:
      type: object
      properties:
        id: { type: string, example: auth-gateway }
        name: { type: string, example: auth-gateway }
        type: { type: string, example: api }
        teamId: { type: string, example: platform }
        status: { type: string, enum: [healthy, degraded, down], example: healthy }
        version: { type: string, example: 1.0.0 }
      required: [id, name, type, teamId, status, version]
    DependencyEdge:
      type: object
      properties:
        source: { type: string, example: web-app }
        target: { type: string, example: auth-gateway }
        type: { type: string, enum: [sync, async], example: sync }
      required: [source, target, type]
    ChangeProposal:
      type: object
      properties:
        serviceId: { type: string, example: auth-gateway }
        changeType: { type: string, enum: [api, schema, infra, config], example: api }
        title: { type: string, example: Introduce v2 auth endpoint }
        description: { type: string, example: Add /auth/v2/login endpoint }
      required: [serviceId, changeType, title, description]
    ImpactResult:
      type: object
      properties:
        riskScore: { $ref: '#/components/schemas/RiskScore' }
        affectedServices:
          type: array
          items:
            type: object
            properties:
              service: { type: string, example: web-app }
              reason: { type: string, example: Depends on changed API contract }
            required: [service, reason]
      required: [riskScore, affectedServices]
    RiskScore:
      type: integer
      minimum: 0
      maximum: 100
      example: 68
    Team:
      type: object
      properties:
        id: { type: string, example: platform }
        name: { type: string, example: Platform Team }
      required: [id, name]
    User:
      type: object
      properties:
        id: { type: string, example: user-123 }
        email: { type: string, format: email, example: user@ripplemark.io }
        roles:
          type: array
          items: { type: string, example: admin }
      required: [id, email, roles]
