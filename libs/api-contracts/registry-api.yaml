openapi: 3.1.0
info:
  title: Ripplemark Registry API
  version: 1.0.0
  description: Service catalog, ownership, and snapshots APIs.
  license:
    name: MIT
    identifier: MIT
servers:
  - url: https://api.ripplemark.local/registry
security:
  - bearerAuth: []
paths:
  /api/services:
    get:
      operationId: listServices
      summary: List services
      parameters:
        - in: query
          name: search
          schema: { type: string }
        - in: query
          name: team
          schema: { type: string }
      responses:
        '200':
          description: Service page
          content:
            application/json:
              schema:
                type: object
                properties:
                  count: { type: integer, example: 42 }
                  results:
                    type: array
                    items: { $ref: '#/components/schemas/ServiceNode' }
                required: [count, results]
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
    post:
      operationId: registerService
      summary: Register service
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ServiceNode' }
      responses:
        '201':
          description: Created service
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ServiceNode' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
  /api/services/{serviceId}:
    get:
      operationId: getServiceDetails
      summary: Get service details
      parameters:
        - in: path
          name: serviceId
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Service detail
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ServiceNode' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
  /api/teams:
    get:
      operationId: listTeams
      summary: List teams
      responses:
        '200':
          description: Team list
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Team' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
  /api/snapshots:
    get:
      operationId: listSnapshots
      summary: List snapshots
      responses:
        '200':
          description: Snapshot list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/GraphSnapshot'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
  /api/snapshots/diff:
    get:
      operationId: compareSnapshots
      summary: Compare two snapshots
      parameters:
        - in: query
          name: left
          required: true
          schema: { type: string }
        - in: query
          name: right
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Snapshot diff
          content:
            application/json:
              schema:
                type: object
                properties:
                  addedServices:
                    type: array
                    items: { type: string }
                  removedServices:
                    type: array
                    items: { type: string }
                  changedEdges:
                    type: array
                    items: { type: string }
                required: [addedServices, removedServices, changedEdges]
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  responses:
    BadRequest:
      description: Request validation failed
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Unauthorized:
      description: Missing or invalid token
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Forbidden:
      description: User lacks permission
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    InternalError:
      description: Unexpected server error
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
  schemas:
    ErrorResponse:
      type: object
      properties:
        statusCode: { type: integer, example: 404 }
        message: { type: string, example: Service not found }
      required: [statusCode, message]
    ServiceNode:
      type: object
      properties:
        id: { type: string, example: registry-service }
        name: { type: string, example: registry-service }
        type: { type: string, example: database }
        teamId: { type: string, example: platform }
        status: { type: string, enum: [healthy, degraded, down], example: healthy }
        version: { type: string, example: 1.0.0 }
      required: [id, name, type, teamId, status, version]
    DependencyEdge:
      type: object
      properties:
        source: { type: string, example: auth-gateway }
        target: { type: string, example: registry-service }
        type: { type: string, enum: [sync, async], example: sync }
      required: [source, target, type]
    GraphSnapshot:
      type: object
      properties:
        id: { type: string, example: snap-102 }
        capturedAt: { type: string, format: date-time, example: '2026-02-14T10:00:00Z' }
        nodes:
          type: array
          items: { $ref: '#/components/schemas/ServiceNode' }
        edges:
          type: array
          items: { $ref: '#/components/schemas/DependencyEdge' }
      required: [id, capturedAt, nodes, edges]
    Team:
      type: object
      properties:
        id: { type: string, example: platform }
        name: { type: string, example: Platform Team }
      required: [id, name]