server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  location / {
    try_files $uri $uri/ /index.html;
  }

  location /api/auth/ {
    rewrite ^/api/auth/(.*)$ /auth/$1 break;
    proxy_pass http://auth-gateway:3000;
  }

  location /api/ {
    proxy_pass http://auth-gateway:3000;
  }
}
