[project]
name = "registry-service"
version = "0.1.0"
description = "Service registry and ownership metadata service"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "Django>=5.1",
  "djangorestframework>=3.15",
  "djangorestframework-simplejwt>=5.3",
  "django-filter>=24.2",
  "django-environ>=0.11",
  "django-structlog>=8.0",
  "structlog>=24.1",
  "psycopg[binary]>=3.2",
  "httpx>=0.27",
  "uvicorn>=0.30",
  "gunicorn>=22.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-django>=4.8",
  "pytest-cov>=5.0",
  "factory-boy>=3.3",
  "ruff>=0.5",
]

[tool.ruff]
line-length = 100
src = ["registry"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "registry.settings.test"
pythonpath = ["registry"]
addopts = "-q"

[tool.coverage.run]
source = ["registry/apps"]
branch = true

[tool.coverage.report]
fail_under = 80
show_missing = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["registry"]
