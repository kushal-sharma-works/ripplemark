name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write
  packages: write

jobs:
  semantic-version:
    name: Derive semantic version
    runs-on: ubuntu-latest
    outputs:
      next_version: ${{ steps.version.outputs.next_version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute next semantic version from conventional commits
        id: version
        shell: bash
        run: |
          set -euo pipefail

          current_tag="${GITHUB_REF_NAME}"
          previous_tag="$(git describe --tags --abbrev=0 "${GITHUB_SHA}^" 2>/dev/null || true)"

          if [[ -n "$previous_tag" ]]; then
            commit_range="$previous_tag..$current_tag"
          else
            commit_range="$current_tag"
          fi

          commits="$(git log --pretty=%B $commit_range || true)"

          bump="patch"
          if echo "$commits" | grep -qE 'BREAKING CHANGE|^[a-z]+\(.*\)!:|^[a-z]+!:'; then
            bump="major"
          elif echo "$commits" | grep -qE '^feat(\(.+\))?:'; then
            bump="minor"
          fi

          version_without_v="${current_tag#v}"
          IFS='.' read -r major minor patch <<< "$version_without_v"

          case "$bump" in
            major)
              major=$((major + 1)); minor=0; patch=0 ;;
            minor)
              minor=$((minor + 1)); patch=0 ;;
            patch)
              patch=$((patch + 1)) ;;
          esac

          next_version="v${major}.${minor}.${patch}"
          echo "next_version=$next_version" >> "$GITHUB_OUTPUT"

  build-and-push-images:
    name: Build and push production image (${{ matrix.service }})
    needs: semantic-version
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        include:
          - service: topology-service
            context: apps/topology-service
          - service: auth-gateway
            context: apps/auth-gateway
          - service: analysis-service
            context: apps/analysis-service
          - service: registry-service
            context: apps/registry-service
          - service: web-app
            context: apps/web-app
    steps:
      - uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push production image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.context }}/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/ripplemark-${{ matrix.service }}:${{ github.ref_name }}
            ghcr.io/${{ github.repository_owner }}/ripplemark-${{ matrix.service }}:latest

  package-and-push-helm:
    name: Package and push Helm charts
    needs: semantic-version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Helm
        uses: azure/setup-helm@v4

      - name: Login Helm OCI registry (GHCR)
        run: echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Package and push all charts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .helm-packages

          while IFS= read -r chart_yaml; do
            chart_dir="$(dirname "$chart_yaml")"
            chart_name="$(basename "$chart_dir")"
            helm package "$chart_dir" --destination .helm-packages
            helm push ".helm-packages/${chart_name}-"*.tgz "oci://ghcr.io/${{ github.repository_owner }}/ripplemark-charts"
          done < <(find infra/helm -maxdepth 2 -name Chart.yaml -print)

  changelog:
    name: Generate changelog and publish release
    needs:
      - semantic-version
      - build-and-push-images
      - package-and-push-helm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate changelog
        run: |
          npx --yes conventional-changelog-cli -p angular -i CHANGELOG.md -s

      - name: Upload changelog artifact
        uses: actions/upload-artifact@v4
        with:
          name: changelog-${{ github.ref_name }}
          path: CHANGELOG.md

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          body_path: CHANGELOG.md
