name: Continuous Deployment

on:
  push:
    branches:
      - main

permissions:
  contents: write
  packages: write

jobs:
  detect-changes:
    name: Detect changed deployable services
    runs-on: ubuntu-latest
    outputs:
      changed_csv: ${{ steps.collect.outputs.changed_csv }}
    steps:
      - uses: actions/checkout@v4

      - id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            shared:
              - 'libs/**'
              - '.github/workflows/cd.yml'
            topology:
              - 'apps/topology-service/**'
            auth_gateway:
              - 'apps/auth-gateway/**'
            analysis:
              - 'apps/analysis-service/**'
            registry:
              - 'apps/registry-service/**'
            web_app:
              - 'apps/web-app/**'

      - name: Collect changed services
        id: collect
        shell: bash
        run: |
          set -euo pipefail
          shared='${{ steps.filter.outputs.shared }}'
          services=()

          if [[ '${{ steps.filter.outputs.topology }}' == 'true' || "$shared" == 'true' ]]; then
            services+=("topology-service")
          fi
          if [[ '${{ steps.filter.outputs.auth_gateway }}' == 'true' || "$shared" == 'true' ]]; then
            services+=("auth-gateway")
          fi
          if [[ '${{ steps.filter.outputs.analysis }}' == 'true' || "$shared" == 'true' ]]; then
            services+=("analysis-service")
          fi
          if [[ '${{ steps.filter.outputs.registry }}' == 'true' || "$shared" == 'true' ]]; then
            services+=("registry-service")
          fi
          if [[ '${{ steps.filter.outputs.web_app }}' == 'true' || "$shared" == 'true' ]]; then
            services+=("web-app")
          fi

          changed_csv="$(IFS=,; echo "${services[*]-}")"
          echo "changed_csv=$changed_csv" >> "$GITHUB_OUTPUT"

  build-and-push:
    name: Build and push image (${{ matrix.service }})
    needs: detect-changes
    if: needs.detect-changes.outputs.changed_csv != ''
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        include:
          - service: topology-service
            context: apps/topology-service
          - service: auth-gateway
            context: apps/auth-gateway
          - service: analysis-service
            context: apps/analysis-service
          - service: registry-service
            context: apps/registry-service
          - service: web-app
            context: apps/web-app
    steps:
      - uses: actions/checkout@v4

      - name: Check if service changed
        id: gate
        shell: bash
        run: |
          set -euo pipefail
          if [[ ",${{ needs.detect-changes.outputs.changed_csv }}," == *",${{ matrix.service }},"* ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Docker Buildx
        if: steps.gate.outputs.changed == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        if: steps.gate.outputs.changed == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        if: steps.gate.outputs.changed == 'true'
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.context }}/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/ripplemark-${{ matrix.service }}:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/ripplemark-${{ matrix.service }}:latest

  update-helm-tags:
    name: Update Helm image tags
    needs:
      - detect-changes
      - build-and-push
    if: needs.detect-changes.outputs.changed_csv != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update values tags to commit SHA
        shell: bash
        run: |
          set -euo pipefail
          changed="${{ needs.detect-changes.outputs.changed_csv }}"

          for service in ${changed//,/ }; do
            values_file="infra/helm/$service/values.yaml"
            if [[ -f "$values_file" ]]; then
              sed -i -E 's/^([[:space:]]*tag:[[:space:]]*).*/\1"${{ github.sha }}"/' "$values_file"
              echo "Updated $values_file"
            fi
          done

      - name: Commit and push chart changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if git diff --quiet; then
            echo "No Helm image tag changes to commit"
            exit 0
          fi

          git add infra/helm
          git commit -m "chore(cd): update Helm image tags to ${{ github.sha }}"
          git push

  argocd-sync-dev:
    name: Trigger Argo CD dev sync
    needs:
      - detect-changes
      - build-and-push
    if: needs.detect-changes.outputs.changed_csv != ''
    runs-on: ubuntu-latest
    steps:
      - name: Check Argo CD credentials
        id: argocd_gate
        shell: bash
        env:
          ARGOCD_SERVER: ${{ secrets.ARGOCD_SERVER }}
          ARGOCD_AUTH_TOKEN: ${{ secrets.ARGOCD_AUTH_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -n "${ARGOCD_SERVER}" && -n "${ARGOCD_AUTH_TOKEN}" ]]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "Skipping Argo CD sync because ARGOCD_SERVER or ARGOCD_AUTH_TOKEN is not configured."
          fi

      - name: Install Argo CD CLI
        if: steps.argocd_gate.outputs.enabled == 'true'
        run: |
          curl -sSL -o argocd https://github.com/argoproj/argo-cd/releases/latest/download/argocd-linux-amd64
          chmod +x argocd
          sudo mv argocd /usr/local/bin/argocd

      - name: Sync changed dev applications
        if: steps.argocd_gate.outputs.enabled == 'true'
        env:
          ARGOCD_SERVER: ${{ secrets.ARGOCD_SERVER }}
          ARGOCD_AUTH_TOKEN: ${{ secrets.ARGOCD_AUTH_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          argocd login "$ARGOCD_SERVER" --insecure --grpc-web --auth-token "$ARGOCD_AUTH_TOKEN"

          changed="${{ needs.detect-changes.outputs.changed_csv }}"
          for service in ${changed//,/ }; do
            app_name="${service}-dev"
            echo "Syncing $app_name"
            argocd app sync "$app_name" --grpc-web
          done
