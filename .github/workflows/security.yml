name: Security Scanning

on:
  pull_request:
    branches:
      - main
  schedule:
    - cron: '0 4 * * 1'

permissions:
  contents: read
  security-events: write
  pull-requests: write

jobs:
  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4

  codeql:
    name: CodeQL scan
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        language: [javascript-typescript, python]
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
      - uses: github/codeql-action/autobuild@v3
      - uses: github/codeql-action/analyze@v3

  trivy-images:
    name: Trivy image scan (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        include:
          - service: topology-service
            context: apps/topology-service
          - service: auth-gateway
            context: apps/auth-gateway
          - service: analysis-service
            context: apps/analysis-service
          - service: registry-service
            context: apps/registry-service
          - service: web-app
            context: apps/web-app
    steps:
      - uses: actions/checkout@v4

      - name: Build local image
        run: docker build -t ripplemark/${{ matrix.service }}:security ${{ matrix.context }}

      - name: Trivy vulnerability scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ripplemark/${{ matrix.service }}:security
          format: table
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'
