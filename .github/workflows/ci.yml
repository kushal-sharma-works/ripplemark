name: Continuous Integration

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  detect-changes:
    name: Detect changed services
    runs-on: ubuntu-latest
    outputs:
      nest_matrix: ${{ steps.matrices.outputs.nest_matrix }}
      python_matrix: ${{ steps.matrices.outputs.python_matrix }}
      angular_changed: ${{ steps.matrices.outputs.angular_changed }}
      helm_changed: ${{ steps.filter.outputs.helm }}
      openapi_changed: ${{ steps.filter.outputs.openapi }}
    steps:
      - uses: actions/checkout@v4

      - name: Path filters
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            shared:
              - 'libs/**'
              - 'ci/**'
              - '.github/workflows/**'
            topology:
              - 'apps/topology-service/**'
            auth_gateway:
              - 'apps/auth-gateway/**'
            analysis:
              - 'apps/analysis-service/**'
            registry:
              - 'apps/registry-service/**'
            web_app:
              - 'apps/web-app/**'
            helm:
              - 'infra/helm/**'
            openapi:
              - 'libs/api-contracts/*.yaml'

      - name: Build service matrices
        id: matrices
        shell: bash
        run: |
          set -euo pipefail

          shared='${{ steps.filter.outputs.shared }}'

          nest=()
          python=()

          if [[ '${{ steps.filter.outputs.topology }}' == 'true' || "$shared" == 'true' ]]; then
            nest+=("\"topology-service\"")
          fi
          if [[ '${{ steps.filter.outputs.auth_gateway }}' == 'true' || "$shared" == 'true' ]]; then
            nest+=("\"auth-gateway\"")
          fi

          if [[ '${{ steps.filter.outputs.analysis }}' == 'true' || "$shared" == 'true' ]]; then
            python+=("\"analysis-service\"")
          fi
          if [[ '${{ steps.filter.outputs.registry }}' == 'true' || "$shared" == 'true' ]]; then
            python+=("\"registry-service\"")
          fi

          nest_json="[$(IFS=,; echo "${nest[*]-}")]"
          python_json="[$(IFS=,; echo "${python[*]-}")]"
          angular_changed='false'
          if [[ '${{ steps.filter.outputs.web_app }}' == 'true' || "$shared" == 'true' ]]; then
            angular_changed='true'
          fi

          echo "nest_matrix=$nest_json" >> "$GITHUB_OUTPUT"
          echo "python_matrix=$python_json" >> "$GITHUB_OUTPUT"
          echo "angular_changed=$angular_changed" >> "$GITHUB_OUTPUT"

  angular-ci:
    name: Angular CI (web-app)
    needs: detect-changes
    if: needs.detect-changes.outputs.angular_changed == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web-app
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile --prod=false

      - name: Lint
        run: pnpm lint

      - name: Test with coverage
        run: pnpm test:cov --runInBand

      - name: Production build
        run: pnpm build --configuration=production

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-web-app
          path: apps/web-app/coverage
          if-no-files-found: warn

  helm-lint:
    name: Helm lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Helm
        uses: azure/setup-helm@v4

      - name: Lint all charts
        shell: bash
        run: |
          set -euo pipefail
          charts=$(find infra/helm -maxdepth 2 -name Chart.yaml -print)
          if [[ -z "$charts" ]]; then
            echo "No charts found under infra/helm; skipping."
            exit 0
          fi

          while IFS= read -r chart_yaml; do
            chart_dir=$(dirname "$chart_yaml")
            echo "Linting $chart_dir"
            helm lint "$chart_dir"
          done <<< "$charts"

